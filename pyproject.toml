[project]
name = "uploader-legacy"
version = "0.1.2"
description = "Open TikTok Studio for an account using cookies and its database proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<47",
    "psycopg[binary]>=3.2,<4",
    "selenium>=4.28,<5",
]

[project.scripts]
studio = "uploader_legacy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
